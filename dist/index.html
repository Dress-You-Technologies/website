<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#000000">
    <title>dressyou — the new way to experience fashion</title>
    <meta name="description" content="dressyou is a Paris-based fashion venture building a new way to experience fashion. The dressyou app is launching soon.">
    <link rel="canonical" href="https://dressyouapp.com/">
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">

    <!-- Favicons. The mark is white, so every icon carries a black plate to stay
         visible in light-theme tabs and on the white rows of search results. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48">
    <link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="dressyou">
    <meta property="og:locale" content="en_US">
    <meta property="og:url" content="https://dressyouapp.com/">
    <meta property="og:title" content="dressyou — the new way to experience fashion">
    <meta property="og:description" content="dressyou is a Paris-based fashion venture. The dressyou app is launching soon.">
    <meta property="og:image" content="https://dressyouapp.com/og-image.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="The dressyou wordmark and its symbol on black, above the line “the new way to experience fashion.”">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="dressyou — the new way to experience fashion">
    <meta name="twitter:description" content="dressyou is a Paris-based fashion venture. The dressyou app is launching soon.">
    <meta name="twitter:image" content="https://dressyouapp.com/og-image.jpg">

    <link rel="preload" href="/fonts/Manrope.woff2" as="font" type="font/woff2" crossorigin="anonymous">
    <link rel="stylesheet" href="/style.css">
    <script type="module" src="/app.mjs"></script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://dressyouapp.com/#organization",
          "name": "dressyou",
          "url": "https://dressyouapp.com/",
          "slogan": "the new way to experience fashion.",
          "description": "dressyou is a Paris-based fashion venture building a new way to experience fashion.",
          "address": {
            "@type": "PostalAddress",
            "addressLocality": "Paris",
            "addressCountry": "FR"
          },
          "logo": {
            "@type": "ImageObject",
            "url": "https://dressyouapp.com/icon-512.png",
            "width": 512,
            "height": 512
          }
        },
        {
          "@type": "WebSite",
          "@id": "https://dressyouapp.com/#website",
          "url": "https://dressyouapp.com/",
          "name": "dressyou",
          "description": "dressyou is a Paris-based fashion venture. The dressyou app is launching soon.",
          "inLanguage": "en",
          "publisher": { "@id": "https://dressyouapp.com/#organization" }
        }
      ]
    }
    </script>
  </head>
  <body>
    <main class="experience" data-phase="loading" aria-label="dressyou">
      <section class="loading-scene" aria-label="coming soon">
        <div class="montage" aria-hidden="true">
          <picture class="shot">
            <source media="(max-aspect-ratio: 2/3)" srcset="/images/01-noir-stride-portrait.webp">
            <source media="(max-aspect-ratio: 19/20)" srcset="/images/01-noir-stride.webp">
            <img src="/images/01-noir-stride-landscape.webp" alt="" draggable="false">
          </picture>
          <picture class="shot">
            <source media="(max-aspect-ratio: 2/3)" srcset="/images/02-chalk-shirt-portrait.webp">
            <source media="(max-aspect-ratio: 19/20)" srcset="/images/02-chalk-shirt.webp">
            <img src="/images/02-chalk-shirt-landscape.webp" alt="" draggable="false">
          </picture>
          <picture class="shot">
            <source media="(max-aspect-ratio: 2/3)" srcset="/images/03-sand-trench-portrait.webp">
            <source media="(max-aspect-ratio: 19/20)" srcset="/images/03-sand-trench.webp">
            <img src="/images/03-sand-trench-landscape.webp" alt="" draggable="false">
          </picture>
          <picture class="shot">
            <source media="(max-aspect-ratio: 2/3)" srcset="/images/04-bordeaux-knit-portrait.webp">
            <source media="(max-aspect-ratio: 19/20)" srcset="/images/04-bordeaux-knit.webp">
            <img src="/images/04-bordeaux-knit-landscape.webp" alt="" draggable="false">
          </picture>
          <picture class="shot">
            <source media="(max-aspect-ratio: 2/3)" srcset="/images/05-ivory-turn-portrait.webp">
            <source media="(max-aspect-ratio: 19/20)" srcset="/images/05-ivory-turn.webp">
            <img src="/images/05-ivory-turn-landscape.webp" alt="" draggable="false">
          </picture>
          <picture class="shot">
            <source media="(max-aspect-ratio: 2/3)" srcset="/images/06-sage-tailoring-portrait.webp">
            <source media="(max-aspect-ratio: 19/20)" srcset="/images/06-sage-tailoring.webp">
            <img src="/images/06-sage-tailoring-landscape.webp" alt="" draggable="false">
          </picture>
        </div>
        <div class="loading-copy">
          <!-- The brand line is the real heading for crawlers and screen readers; it is
               out of flow, so the visible "coming soon" keeps its exact box and fill. -->
          <h1><span class="sr-only">dressyou — the new way to experience fashion</span>coming soon<span class="progress-fill" aria-hidden="true">coming soon</span></h1>
          <div class="progress sr-only" role="progressbar" aria-label="loading dressyou introduction" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div>
        </div>
      </section>
      <section class="identity" aria-label="dressyou logo" inert>
        <div class="identity-brand">
          <div class="logo">
            <img class="logo-mark" src="/images/dressyou-logo.webp" width="256" height="256" alt="dressyou" draggable="false">
          </div>
          <span class="wordmark" aria-hidden="true">dressyou</span>
        </div>
        <div class="identity-details">
          <p class="tagline" aria-hidden="true">the new way to experience fashion.</p>
        <button class="replay" type="button" aria-label="replay introduction" title="replay">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 9a8 8 0 1 1-.3 5.3M4.5 4.5V9H9"/></svg>
        </button>
        </div>
      </section>
      <button class="skip" type="button" aria-label="skip introduction" title="skip introduction">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m7 6 7 6-7 6M17 6v12"/></svg>
      </button>
      <p class="sr-only status" role="status"></p>
    </main>
    <noscript><style>.loading-scene,.skip,.replay{display:none}.identity{visibility:visible;opacity:1}.experience .logo{left:0;translate:0}</style><p class="noscript-copy">coming soon</p></noscript>
  </body>
</html>
